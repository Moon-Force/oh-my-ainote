AutoName: oh-my-ainote
Summary: Local-first handwriting notebook for Android tablets
Description: |-
  A local-first, account-free notebook for Android tablets. It supports template,
  PDF and image paper, low-latency AndroidX Ink handwriting, optional user-supplied
  OpenAI-compatible vision endpoints, flattened PDF export and the portable .ainote
  format. Network access occurs only when the user explicitly asks about a selected
  page region.

